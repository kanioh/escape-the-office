name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest

    # @SpringBootTest がアプリ全体を起動するため DB が要る。
    # 接続情報は application.yaml の既定値（localhost:5432 / postgres / postgres）と
    # 揃っているので、環境変数の受け渡しは不要
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: escape_the_office
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        # 起動しただけでは接続を受け付けないため、healthy になるまで待たせる
        options: >-
          --health-cmd "pg_isready -U postgres -d escape_the_office"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: temurin
          # ~/.m2 を保存し、次回以降の依存ダウンロードを省く
          cache: maven

      - name: Run tests
        working-directory: backend
        run: ./mvnw -B test

  frontend:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Type check
        working-directory: frontend
        run: npx tsc --noEmit

      - name: Lint
        working-directory: frontend
        run: npm run lint

      # 型チェックと lint では拾えない失敗（サーバーコンポーネントの記述ミスなど）を検出する
      - name: Build
        working-directory: frontend
        run: npm run build

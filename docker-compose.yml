services:
  db:
    image: postgres:17
    container_name: escape-the-office-db
    # 自分で停止したときは止まったまま、それ以外（EC2 再起動など）では自動復帰する
    restart: unless-stopped
    environment:
      # ${変数:-既定値} 形式。同じディレクトリの .env があればその値を使う。
      # .env はコミットしないため、本番の資格情報がリポジトリに残らない
      POSTGRES_DB: ${POSTGRES_DB:-escape_the_office}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      TZ: Asia/Tokyo
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-escape_the_office}",
        ]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    container_name: escape-the-office-backend
    restart: unless-stopped
    environment:
      # ホスト名はサービス名の db。コンテナにとって localhost は自分自身を指すため。
      # 接続先とユーザーは db サービスと同じ変数を参照し、片方だけ変わる事故を防ぐ
      DB_URL: jdbc:postgresql://db:5432/${POSTGRES_DB:-escape_the_office}
      DB_USERNAME: ${POSTGRES_USER:-postgres}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      TZ: Asia/Tokyo
    ports:
      - "8080:8080"
    depends_on:
      db:
        # 起動直後に Flyway が接続するため、db が接続を受け付けるまで待つ
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      args:
        # ビルド時にJSへ焼き込まれる、ブラウザから見た接続先。
        # 本番は Caddy が同一ドメインで振り分けるため空文字を渡して相対パスにする。
        # ${変数-既定値} はコロン無し＝空文字を渡すとそのまま採用される
        NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL-http://localhost:8080}
    container_name: escape-the-office-frontend
    restart: unless-stopped
    environment:
      # サーバーコンポーネントの fetch はコンテナ内で実行されるため、こちらはサービス名。
      # Caddy を経由せず直接呼ぶ方が速く、経路も単純になる
      API_BASE_URL: http://backend:8080
      TZ: Asia/Tokyo
    ports:
      - "3000:3000"
    depends_on:
      - backend

  caddy:
    image: caddy:2-alpine
    container_name: escape-the-office-caddy
    # .env に COMPOSE_PROFILES=prod がある本番でだけ起動する。
    # ローカルには証明書を取得できるドメインが無いため
    profiles: ["prod"]
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      # 取得した証明書の保存先。ボリュームにしないと作り直すたびに再取得となり、
      # Let's Encrypt の発行制限に引っかかる
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - frontend
      - backend

volumes:
  postgres-data:
  caddy-data:
  caddy-config:

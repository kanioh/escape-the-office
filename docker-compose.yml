services:
  db:
    image: postgres:17
    container_name: escape-the-office-db
    environment:
      POSTGRES_DB: escape_the_office
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      TZ: Asia/Tokyo
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d escape_the_office"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres-data:
